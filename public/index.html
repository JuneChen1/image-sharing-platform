<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>圖個方便 | PicShare</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div data-include="/partials/chrome.html"></div>

  <main class="container">
    <div class="d-flex gap-2 mb-4">
      <input
        type="text"
        class="form-control"
        placeholder="搜尋本站分享的照片（開發中）"
        disabled
      />
      <button type="button" class="btn btn-outline-dark text-nowrap" disabled>搜尋</button>
    </div>
    <div id="status" class="text-muted mb-3"></div>
    <div id="results" class="masonry-columns"></div>
    <nav aria-label="Page navigation" class="mt-4">
      <ul id="pagination" class="pagination justify-content-center"></ul>
    </nav>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/include.js"></script>
  <script src="/js/share.js"></script>
  <script src="/js/nav-search.js"></script>
  <script src="/js/home.js"></script>
</body>
</html>

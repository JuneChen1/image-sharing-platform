<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>圖個方便 | PicShare</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">📸 圖個方便 | PicShare</span>
      <div>
        <button
          type="button"
          class="btn btn-outline-light me-2"
          data-bs-toggle="modal"
          data-bs-target="#searchModal"
        >
          搜尋
        </button>
        <button
          type="button"
          class="btn btn-outline-light"
          data-bs-toggle="modal"
          data-bs-target="#shareModal"
        >
          分享
        </button>
      </div>
    </div>
  </nav>

  <!-- Vertically centered modal -->
  <div class="modal fade" id="searchModal" tabindex="-1" aria-labelledby="searchModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="searchModalLabel">搜尋 Unsplash 照片</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="search-form">
          <div class="modal-body">
            <input
              type="text"
              id="search-input"
              class="form-control"
              placeholder="輸入關鍵字搜尋 Unsplash 圖片，例如 Long-tailed Tit"
              required
            />
            <div id="search-modal-status" class="text-muted mt-2"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="submit" class="btn btn-dark">搜尋</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Vertically centered modal -->
  <div class="modal fade" id="shareModal" tabindex="-1" aria-labelledby="shareModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="shareModalLabel">分享 Unsplash 照片</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="share-form">
          <div class="modal-body">
            <input
              type="text"
              id="share-input"
              class="form-control"
              placeholder="Unsplash 圖片網址，例如 https://unsplash.com/photos/xxxxx"
              required
            />
            <div id="share-status" class="text-muted mt-2"></div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="submit" class="btn btn-dark">分享</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <main class="container">
    <div id="status" class="text-muted mb-3"></div>
    <div id="results" class="row g-3"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>

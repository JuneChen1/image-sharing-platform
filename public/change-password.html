<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>修改密碼 | PicShare</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div data-include="/partials/chrome.html"></div>

  <main class="container" style="max-width: 480px;">
    <div id="change-password-pane">
      <h1 class="h4 mb-4 text-center">修改密碼</h1>
      <form id="change-password-form">
        <div class="mb-3">
          <label for="old-password" class="form-label">舊密碼</label>
          <input type="password" id="old-password" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="new-password" class="form-label">新密碼</label>
          <input type="password" id="new-password" class="form-control" required />
          <div class="form-text">至少 8 碼，需同時包含英文字母與數字</div>
        </div>
        <div class="mb-3">
          <label for="confirm-password" class="form-label">確認新密碼</label>
          <input type="password" id="confirm-password" class="form-control" required />
        </div>
        <div id="change-password-status" class="text-muted mb-3"></div>
        <button type="submit" class="btn btn-dark w-100 mb-3">更新密碼</button>
        <p class="text-center mb-0">
          <a href="/profile.html">返回個人資料</a>
        </p>
      </form>
    </div>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/include.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/changePasswordPage.js"></script>
</body>
</html>

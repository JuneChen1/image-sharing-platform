<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>我的收藏 | PicShare</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div data-include="/partials/chrome.html"></div>

  <main class="container">
    <div id="collections-list-view">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="h4 mb-0">我的收藏庫</h1>
        <button type="button" id="new-collection-btn" class="btn btn-dark">新增收藏庫</button>
      </div>
      <div id="collections-status" class="text-muted mb-3"></div>
      <div id="collections-grid" class="row g-3"></div>
    </div>

    <div id="collection-detail-view" class="d-none">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div class="d-flex align-items-center gap-2">
          <button type="button" id="back-to-collections-btn" class="btn btn-outline-dark btn-sm">← 返回收藏庫列表</button>
          <h1 id="collection-detail-title" class="h4 mb-0"></h1>
        </div>
        <button type="button" id="delete-collection-btn" class="btn btn-outline-danger btn-sm">刪除此收藏庫</button>
      </div>
      <div id="collection-photos-status" class="text-muted mb-3"></div>
      <div id="collection-photos-grid" class="row g-3"></div>
    </div>
  </main>

  <div data-include="/partials/footer.html"></div>

  <div class="modal fade" id="newCollectionModal" tabindex="-1" aria-labelledby="newCollectionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="newCollectionModalLabel">新增收藏庫</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="new-collection-form">
          <div class="modal-body">
            <input
              type="text"
              id="new-collection-name"
              class="form-control"
              placeholder="輸入收藏庫名稱"
              maxlength="100"
              required
            />
            <div id="new-collection-alert" class="alert d-none alert-dismissible d-flex align-items-center mt-2 mb-0" role="alert">
              <svg id="new-collection-alert-icon" width="16" height="16" fill="currentColor" class="flex-shrink-0 me-2" viewBox="0 0 16 16" role="img" aria-hidden="true"></svg>
              <div id="new-collection-alert-message" class="flex-grow-1"></div>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="submit" class="btn btn-dark">建立</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/include.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/share.js"></script>
  <script src="/js/lightbox.js"></script>
  <script src="/js/collect.js"></script>
  <script src="/js/collections.js"></script>
</body>
</html>

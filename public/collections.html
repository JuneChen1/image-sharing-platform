<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title.collections">我的收藏 | PicShare</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div data-include="/partials/chrome.html"></div>

  <main class="container">
    <div id="collections-list-view">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="visually-hidden" data-i18n="collections.heading">我的收藏庫</h1>
        <nav aria-label="導覽路徑" data-i18n-aria-label="common.breadcrumbAria">
          <ol class="breadcrumb mb-0">
            <li class="breadcrumb-item"><a href="/" data-i18n="common.breadcrumbHome">首頁</a></li>
            <li class="breadcrumb-item active" aria-current="page" data-i18n="collections.heading">我的收藏庫</li>
          </ol>
        </nav>
        <button type="button" id="new-collection-btn" class="btn btn-dark" data-i18n="collections.new">新增收藏庫</button>
      </div>
      <div id="collections-status" class="text-muted mb-3"></div>
      <div id="collections-grid" class="row g-3"></div>
    </div>

    <div id="collection-detail-view" class="d-none">
      <nav aria-label="導覽路徑" data-i18n-aria-label="common.breadcrumbAria">
        <ol class="breadcrumb mb-2">
          <li class="breadcrumb-item"><a href="/" data-i18n="common.breadcrumbHome">首頁</a></li>
          <li class="breadcrumb-item"><a href="#" id="breadcrumb-collections-link" data-i18n="collections.heading">我的收藏庫</a></li>
          <li class="breadcrumb-item active text-break" aria-current="page" id="breadcrumb-collection-name"></li>
        </ol>
      </nav>
      <div class="d-flex align-items-center gap-1 mb-4">
        <h1 id="collection-detail-title" class="h4 mb-0 text-break"></h1>
        <button type="button" id="edit-collection-btn" class="collection-edit-link flex-shrink-0">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M12.146.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168zM11.207 2.5 13.5 4.793 14.793 3.5 12.5 1.207zm1.586 3L10.5 3.207 4 9.707V10h.5a.5.5 0 0 1 .5.5v.5h.5a.5.5 0 0 1 .5.5v.5h.293zm-9.761 5.175-.106.106-1.528 3.821 3.821-1.528.106-.106A.5.5 0 0 1 5 12.5V12h-.5a.5.5 0 0 1-.5-.5V11h-.5a.5.5 0 0 1-.468-.325"/>
          </svg>
          <span data-i18n="collections.rename">編輯</span>
        </button>
      </div>
      <div id="collection-photos-status" class="text-muted mb-3"></div>
      <div id="collection-photos-grid" class="row g-3"></div>

      <div class="border-top pt-3 mt-5 d-flex justify-content-end">
        <button type="button" id="delete-collection-btn" class="collection-delete-link">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M5.5 5.5A.5.5 0 0 1 6 6v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m2.5 0a.5.5 0 0 1 .5.5v6a.5.5 0 0 1-1 0V6a.5.5 0 0 1 .5-.5m3 .5a.5.5 0 0 0-1 0v6a.5.5 0 0 0 1 0z"/>
            <path d="M14.5 3a1 1 0 0 1-1 1H13v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V4h-.5a1 1 0 0 1-1-1V2a1 1 0 0 1 1-1H6a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1h3.5a1 1 0 0 1 1 1zM4.118 4 4 4.059V13a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1V4.059L11.882 4zM2.5 3h11V2h-11z"/>
          </svg>
          <span data-i18n="collections.delete">刪除此收藏庫</span>
        </button>
      </div>
    </div>
  </main>

  <div data-include="/partials/footer.html"></div>

  <div class="modal fade" id="newCollectionModal" tabindex="-1" aria-labelledby="newCollectionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="newCollectionModalLabel" data-i18n="collections.new">新增收藏庫</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="new-collection-form">
          <div class="modal-body">
            <input
              type="text"
              id="new-collection-name"
              class="form-control"
              placeholder="輸入收藏庫名稱"
              data-i18n-placeholder="collect.newPlaceholder"
              maxlength="100"
              required
            />
            <div id="new-collection-alert" class="alert d-none alert-dismissible d-flex align-items-center mt-2 mb-0" role="alert">
              <svg id="new-collection-alert-icon" width="16" height="16" fill="currentColor" class="flex-shrink-0 me-2" viewBox="0 0 16 16" role="img" aria-hidden="true"></svg>
              <div id="new-collection-alert-message" class="flex-grow-1"></div>
              <button type="button" class="btn-close" aria-label="Close"></button>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="common.cancel">取消</button>
            <button type="submit" class="btn btn-dark" data-i18n="collections.create">建立</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <div class="modal fade" id="editCollectionModal" tabindex="-1" aria-labelledby="editCollectionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="editCollectionModalLabel" data-i18n="collections.renameTitle">編輯收藏庫名稱</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="edit-collection-form">
          <div class="modal-body">
            <input
              type="text"
              id="edit-collection-name"
              class="form-control"
              placeholder="輸入收藏庫名稱"
              data-i18n-placeholder="collect.newPlaceholder"
              maxlength="100"
              required
            />
            <div id="edit-collection-alert" class="alert d-none alert-dismissible d-flex align-items-center mt-2 mb-0" role="alert">
              <svg id="edit-collection-alert-icon" width="16" height="16" fill="currentColor" class="flex-shrink-0 me-2" viewBox="0 0 16 16" role="img" aria-hidden="true"></svg>
              <div id="edit-collection-alert-message" class="flex-grow-1"></div>
              <button type="button" class="btn-close" aria-label="Close"></button>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="common.cancel">取消</button>
            <button type="submit" class="btn btn-dark" data-i18n="common.save">儲存</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/escapeHtml.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/include.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/share.js"></script>
  <script src="/js/lightbox.js"></script>
  <script src="/js/collect.js"></script>
  <script src="/js/collections.js"></script>
</body>
</html>

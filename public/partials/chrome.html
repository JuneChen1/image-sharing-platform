<nav class="navbar navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand mb-0 h1 text-decoration-none" href="/">圖個方便 | PicShare</a>
    <div>
      <button
        type="button"
        class="btn btn-outline-light me-2"
        data-bs-toggle="modal"
        data-bs-target="#shareModal"
      >
        分享照片
      </button>
      <a href="/search.html" class="btn btn-outline-light">從 Unsplash 搜尋</a>

<div class="modal fade" id="shareModal" tabindex="-1" aria-labelledby="shareModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="shareModalLabel">分享 Unsplash 照片</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="share-form">
        <div class="modal-body">
          <input
            type="text"
            id="share-input"
            class="form-control mb-3"
            placeholder="Unsplash 圖片網址，例如 https://unsplash.com/photos/xxxxx"
            required
          />

          <label for="category-input" class="form-label">分類（至少一個）</label>
          <div class="d-flex gap-2 mb-2">
            <input
              type="text"
              id="category-input"
              class="form-control"
              placeholder="輸入分類名稱，按 Enter 新增"
            />
            <button type="button" id="category-add-btn" class="btn btn-outline-dark text-nowrap">新增</button>
          </div>
          <div id="category-list" class="d-flex flex-wrap gap-2 mb-2"></div>

          <div id="share-status" class="text-muted mt-2"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="submit" class="btn btn-dark">分享</button>
        </div>
      </form>
    </div>
  </div>
</div>

<div class="modal fade" id="lightboxModal" tabindex="-1" aria-labelledby="lightboxModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content">
      <h5 class="modal-title visually-hidden" id="lightboxModalLabel">照片預覽</h5>
      <div class="modal-body text-center">
        <div class="lightbox-image-wrap">
          <button type="button" class="btn-close lightbox-close" data-bs-dismiss="modal" aria-label="Close"></button>
          <img id="lightbox-image" src="" alt="" class="img-fluid rounded" />
        </div>
        <div id="lightbox-categories" class="d-flex flex-wrap justify-content-start gap-2 mt-3"></div>
      </div>
      <div class="modal-footer d-flex align-items-center justify-content-between">
        <p class="mb-0">
          Photo by
          <a id="lightbox-photographer" href="" target="_blank" rel="noopener"></a>
          on
          <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a>
        </p>
        <div class="d-flex gap-2">
          <button type="button" id="lightbox-share" class="btn btn-outline-dark">分享</button>
          <a id="lightbox-download" href="" target="_blank" rel="noopener" class="btn btn-outline-dark">下載</a>
        </div>
      </div>
    </div>
  </div>
</div>

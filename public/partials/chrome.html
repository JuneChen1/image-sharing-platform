<div class="modal fade" id="shareModal" tabindex="-1" aria-labelledby="shareModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="shareModalLabel" data-i18n="share.title">分享 Unsplash 照片</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉" data-i18n-aria-label="common.close"></button>
      </div>
      <form id="share-form">
        <div class="modal-body">
          <label for="share-input" class="form-label" data-i18n="share.urlLabel">Unsplash 圖片網址</label>
          <input
            type="text"
            id="share-input"
            class="form-control mb-3"
            placeholder="例：https://unsplash.com/photos/xxx"
            data-i18n-placeholder="share.urlPlaceholder"
            required
          />

          <label for="category-input" class="form-label" data-i18n="share.categoryLabel">分類（至少一個）</label>
          <div class="d-flex gap-2 mb-2">
            <input
              type="text"
              id="category-input"
              class="form-control"
              placeholder="輸入分類名稱"
              data-i18n-placeholder="share.categoryPlaceholder"
              maxlength="100"
            />
            <button type="button" id="category-add-btn" class="btn btn-outline-dark text-nowrap" data-i18n="share.add">新增</button>
          </div>
          <div id="category-list" class="d-flex flex-wrap gap-2 mb-2"></div>

          <div id="share-alert" class="alert d-none alert-dismissible d-flex align-items-center mt-2 mb-0" role="alert">
            <svg id="share-alert-icon" width="16" height="16" fill="currentColor" class="flex-shrink-0 me-2" viewBox="0 0 16 16" role="img" aria-hidden="true"></svg>
            <div id="share-alert-message" class="flex-grow-1"></div>
            <button type="button" class="btn-close" aria-label="關閉" data-i18n-aria-label="common.close"></button>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="common.cancel">取消</button>
          <button type="submit" id="share-submit-btn" class="btn btn-dark" data-i18n="common.share">分享</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>重設密碼 | PicShare</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div data-include="/partials/chrome.html"></div>

  <main class="container" style="max-width: 480px;">
    <div id="reset-pane">
      <h1 class="h4 mb-4 text-center">重設密碼</h1>
      <form id="reset-form">
        <div class="mb-3">
          <label for="reset-new-password" class="form-label">新密碼</label>
          <input type="password" id="reset-new-password" class="form-control" required />
          <div class="form-text">至少 8 碼，需同時包含英文字母與數字</div>
        </div>
        <div class="mb-3">
          <label for="reset-confirm-password" class="form-label">確認新密碼</label>
          <input type="password" id="reset-confirm-password" class="form-control" required />
        </div>
        <div id="reset-alert" class="alert d-none alert-dismissible d-flex align-items-center mb-3" role="alert">
          <svg id="reset-alert-icon" width="16" height="16" fill="currentColor" class="flex-shrink-0 me-2" viewBox="0 0 16 16" role="img" aria-hidden="true"></svg>
          <div id="reset-alert-message" class="flex-grow-1"></div>
          <button type="button" class="btn-close" aria-label="Close"></button>
        </div>
        <button type="submit" id="reset-submit-btn" class="btn btn-dark w-100 mb-3">重設密碼</button>
        <p class="text-center mb-0">
          <a href="/auth.html">返回登入</a>
        </p>
      </form>
    </div>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/include.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/resetPasswordPage.js"></script>
</body>
</html>

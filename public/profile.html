<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>個人資料 | PicShare</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div data-include="/partials/chrome.html"></div>

  <main class="container" style="max-width: 480px;">
    <div id="profile-pane">
      <h1 class="h4 mb-4 text-center">個人資料</h1>
      <form id="profile-form">
        <div class="mb-3">
          <label for="profile-email" class="form-label">Email</label>
          <input type="email" id="profile-email" class="form-control" disabled />
        </div>
        <div class="mb-3">
          <label for="profile-name" class="form-label">暱稱</label>
          <input type="text" id="profile-name" class="form-control" required />
        </div>
        <div id="profile-alert" class="alert d-none alert-dismissible d-flex align-items-center mb-3" role="alert">
          <svg id="profile-alert-icon" width="16" height="16" fill="currentColor" class="flex-shrink-0 me-2" viewBox="0 0 16 16" role="img" aria-hidden="true"></svg>
          <div id="profile-alert-message" class="flex-grow-1"></div>
          <button type="button" class="btn-close" aria-label="Close"></button>
        </div>
        <button type="submit" class="btn btn-dark w-100 mb-3">儲存變更</button>
        <p class="text-center mb-0">
          <a href="/change-password.html">修改密碼</a>
        </p>
      </form>

      <hr class="my-4" />

      <div class="border border-danger rounded p-3">
        <h2 class="h6 text-danger mb-2">危險區域</h2>
        <p class="text-muted small mb-3">
          刪除帳號後，你的所有分享、收藏庫、收藏紀錄將被永久刪除，此動作無法復原。
        </p>
        <button type="button" class="btn btn-outline-danger w-100" data-bs-toggle="modal" data-bs-target="#deleteAccountModal">刪除帳號</button>
      </div>
    </div>
  </main>

  <div data-include="/partials/footer.html"></div>

  <div class="modal fade" id="deleteAccountModal" tabindex="-1" aria-labelledby="deleteAccountModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="deleteAccountModalLabel">刪除帳號</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="delete-account-form">
          <div class="modal-body">
            <p class="text-muted small">
              刪除帳號後，你的所有分享、收藏庫、收藏紀錄將被永久刪除，此動作無法復原。
            </p>
            <label for="delete-account-password" class="form-label">請輸入密碼以確認</label>
            <input type="password" id="delete-account-password" class="form-control" required />
            <div id="delete-account-alert" class="alert d-none alert-dismissible d-flex align-items-center mt-3 mb-0" role="alert">
              <svg id="delete-account-alert-icon" width="16" height="16" fill="currentColor" class="flex-shrink-0 me-2" viewBox="0 0 16 16" role="img" aria-hidden="true"></svg>
              <div id="delete-account-alert-message" class="flex-grow-1"></div>
              <button type="button" class="btn-close" aria-label="Close"></button>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
            <button type="submit" class="btn btn-danger">確認刪除</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/include.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/profilePage.js"></script>
</body>
</html>

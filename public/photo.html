<!DOCTYPE html>

<head>

  <title>圖個方便 | PicShare</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"

    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"

  <link href="/css/style.css" rel="stylesheet" />

<body>
  <div data-include="/partials/chrome.html"></div>

  <main class="container">
    <nav aria-label="導覽路徑" data-i18n-aria-label="common.breadcrumbAria">
      <ol class="breadcrumb mb-4">

        <li class="breadcrumb-item active" aria-current="page" data-i18n="photo.breadcrumb">照片</li>
      </ol>
    </nav>
    <h1 class="visually-hidden" data-i18n="photo.heading">照片詳情</h1>
    <div id="status" class="text-muted mb-3"></div>
    <div id="not-found" class="text-center py-5 d-none">
      <p class="mb-3" data-i18n="photo.notFound">找不到這張照片，它可能已被取消分享。</p>
      <a href="/" class="btn btn-dark" data-i18n="photo.backHome">回到首頁</a>
    </div>
    <article id="photo-detail" class="photo-detail d-none"></article>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"

    crossorigin="anonymous"

  <script src="/js/escapeHtml.js"></script>
  <script src="/js/unsplashLink.js"></script>

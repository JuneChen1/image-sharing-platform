<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="title.auth">登入 / 註冊 | PicShare</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div data-include="/partials/chrome.html"></div>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">

        <div id="login-pane">
          <div class="card mx-auto" style="max-width: 400px;">
            <div class="card-body" style="padding: 32px;">
              <div id="login-alert" class="alert d-none alert-dismissible d-flex align-items-center mb-3" role="alert">
                <svg id="login-alert-icon" width="16" height="16" fill="currentColor" class="flex-shrink-0 me-2" viewBox="0 0 16 16" role="img" aria-hidden="true"></svg>
                <div id="login-alert-message" class="flex-grow-1"></div>
                <button type="button" class="btn-close" aria-label="關閉" data-i18n-aria-label="common.close"></button>
              </div>
              <h5 class="card-title mb-3 text-center" data-i18n="auth.login">登入</h5>
              <form id="login-form">
                <div class="mb-3">
                  <label for="login-email" class="form-label">Email</label>
                  <input type="email" id="login-email" class="form-control" autocomplete="username" required />
                </div>
                <div class="mb-3">
                  <label for="login-password" class="form-label" data-i18n="password.label">密碼</label>
                  <input type="password" id="login-password" class="form-control" autocomplete="current-password" required />
                </div>
                <button type="submit" class="btn btn-dark w-100" style="margin-top: 20px;" data-i18n="auth.login">登入</button>
              </form>
              <p class="text-center small mt-3 mb-0">
                <span data-i18n="auth.noAccount">還沒有帳號？</span><a href="#" id="show-register-link" data-i18n="auth.register">註冊</a>
              </p>
              <p class="text-center small mt-1 mb-0">
                <a href="#" id="show-forgot-link" data-i18n="auth.forgotLink">忘記密碼？</a>
              </p>
            </div>
          </div>
        </div>

        <div id="forgot-pane" class="d-none">
          <div class="card mx-auto" style="max-width: 400px;">
            <div class="card-body" style="padding: 32px;">
              <div id="forgot-alert" class="alert d-none alert-dismissible d-flex align-items-center mb-3" role="alert">
                <svg id="forgot-alert-icon" width="16" height="16" fill="currentColor" class="flex-shrink-0 me-2" viewBox="0 0 16 16" role="img" aria-hidden="true"></svg>
                <div id="forgot-alert-message" class="flex-grow-1"></div>
                <button type="button" class="btn-close" aria-label="關閉" data-i18n-aria-label="common.close"></button>
              </div>
              <h5 class="card-title mb-3 text-center" data-i18n="auth.forgotHeading">忘記密碼</h5>
              <form id="forgot-form">
                <div class="mb-3">
                  <label for="forgot-email" class="form-label">Email</label>
                  <input type="email" id="forgot-email" class="form-control" autocomplete="email" required />
                  <div class="form-text" data-i18n="auth.forgotHint">我們會寄送重設密碼連結到此信箱</div>
                </div>
                <button type="submit" class="btn btn-dark w-100" style="margin-top: 20px;" data-i18n="auth.sendReset">寄送重設密碼信</button>
              </form>
              <p class="text-center small mt-3 mb-0">
                <span data-i18n="auth.remembered">想起密碼了？</span><a href="#" id="show-login-from-forgot-link" data-i18n="password.backToLogin">返回登入</a>
              </p>
            </div>
          </div>
        </div>

        <div id="register-pane" class="d-none">
          <div class="card mx-auto" style="max-width: 400px;">
            <div class="card-body" style="padding: 32px;">
              <h5 class="card-title mb-3 text-center" data-i18n="auth.register">註冊</h5>
              <form id="register-form">
                <div class="mb-3">
                  <label for="register-name" class="form-label" data-i18n="user.nickname">暱稱</label>
                  <input type="text" id="register-name" class="form-control" maxlength="50" autocomplete="nickname" required />
                </div>
                <div class="mb-3">
                  <label for="register-email" class="form-label">Email</label>
                  <input type="email" id="register-email" class="form-control" autocomplete="username" required />
                </div>
                <div class="mb-3">
                  <label for="register-password" class="form-label" data-i18n="password.label">密碼</label>
                  <input type="password" id="register-password" class="form-control" autocomplete="new-password" required />
                  <div class="form-text" data-i18n="password.hint">至少 8 碼，需同時包含英文字母與數字</div>
                </div>
                <div class="mb-3">
                  <label for="register-confirm-password" class="form-label" data-i18n="auth.confirmPassword">確認密碼</label>
                  <input type="password" id="register-confirm-password" class="form-control" autocomplete="new-password" required />
                </div>
                <!-- 提示放在送出鈕上方（使用者剛操作完的地方），而不是卡片頂部，手機上才不用捲動才看得到 -->
                <div id="register-alert" class="alert d-none alert-dismissible d-flex align-items-center mb-0" data-alert-spacing="mb-0" role="alert">
                  <svg id="register-alert-icon" width="16" height="16" fill="currentColor" class="flex-shrink-0 me-2" viewBox="0 0 16 16" role="img" aria-hidden="true"></svg>
                  <div id="register-alert-message" class="flex-grow-1"></div>
                  <button type="button" class="btn-close" aria-label="關閉" data-i18n-aria-label="common.close"></button>
                </div>
                <button type="submit" class="btn btn-dark w-100" style="margin-top: 20px;" data-i18n="auth.register">註冊</button>
              </form>
              <p class="text-center small mt-3 mb-0">
                <span data-i18n="auth.haveAccount">已經有帳號了？</span><a href="#" id="show-login-link" data-i18n="auth.login">登入</a>
              </p>
            </div>
          </div>
        </div>

      </div>
    </div>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/include.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/authPage.js"></script>
</body>
</html>

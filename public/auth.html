<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登入 / 註冊 | PicShare</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link href="/css/style.css" rel="stylesheet" />
</head>
<body>
  <div data-include="/partials/chrome.html"></div>

  <main class="container" style="max-width: 480px;">
    <div id="login-pane">
      <h1 class="h4 mb-4 text-center">登入</h1>
      <form id="login-form">
        <div class="mb-3">
          <label for="login-email" class="form-label">Email</label>
          <input type="email" id="login-email" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="login-password" class="form-label">密碼</label>
          <input type="password" id="login-password" class="form-control" required />
        </div>
        <div id="login-status" class="text-muted mb-3"></div>
        <button type="submit" class="btn btn-dark w-100 mb-3">登入</button>
        <p class="text-center mb-1">
          還沒有帳號？<a href="#" id="show-register-link">註冊</a>
        </p>
        <p class="text-center mb-0">
          <a href="#" id="show-forgot-link">忘記密碼？</a>
        </p>
      </form>
    </div>

    <div id="forgot-pane" class="d-none">
      <h1 class="h4 mb-4 text-center">忘記密碼</h1>
      <form id="forgot-form">
        <div class="mb-3">
          <label for="forgot-email" class="form-label">Email</label>
          <input type="email" id="forgot-email" class="form-control" required />
          <div class="form-text">我們會寄送重設密碼連結到此信箱</div>
        </div>
        <div id="forgot-status" class="text-muted mb-3"></div>
        <button type="submit" class="btn btn-dark w-100 mb-3">寄送重設密碼信</button>
        <p class="text-center mb-0">
          想起密碼了？<a href="#" id="show-login-from-forgot-link">返回登入</a>
        </p>
      </form>
    </div>

    <div id="register-pane" class="d-none">
      <h1 class="h4 mb-4 text-center">註冊</h1>
      <form id="register-form">
        <div class="mb-3">
          <label for="register-name" class="form-label">暱稱</label>
          <input type="text" id="register-name" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="register-email" class="form-label">Email</label>
          <input type="email" id="register-email" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="register-password" class="form-label">密碼</label>
          <input type="password" id="register-password" class="form-control" required />
          <div class="form-text">至少 8 碼，需同時包含英文字母與數字</div>
        </div>
        <div id="register-status" class="text-muted mb-3"></div>
        <button type="submit" class="btn btn-dark w-100 mb-3">註冊</button>
        <p class="text-center mb-0">
          已經有帳號了？<a href="#" id="show-login-link">登入</a>
        </p>
      </form>
    </div>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/include.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/authPage.js"></script>
</body>
</html>
